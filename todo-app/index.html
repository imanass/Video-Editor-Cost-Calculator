<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List App - Local Storage</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #3b82f6;
      --primary-dark: #1e40af;
      --primary-light: #dbeafe;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--surface);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      padding: 32px 24px;
      color: white;
      text-align: center;
    }

    .header h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.95;
      font-weight: 500;
    }

    .content {
      padding: 24px;
    }

    .input-section {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
    }

    .input-wrapper {
      flex: 1;
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      transition: all 0.2s;
      background: var(--surface);
      color: var(--text-primary);
    }

    .input-wrapper input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .input-wrapper input::placeholder {
      color: var(--text-muted);
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--border);
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      background: #cbd5e1;
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      padding: 8px;
      border-radius: 6px;
    }

    .btn-danger:hover {
      background: #fee2e2;
    }

    .btn-success {
      background: transparent;
      color: var(--success);
      padding: 8px;
      border-radius: 6px;
    }

    .btn-success:hover {
      background: #ecfdf5;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg);
      padding: 12px 16px;
      border-radius: 10px;
      text-align: center;
    }

    .stat-card .value {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
    }

    .stat-card .label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
      font-weight: 600;
    }

    .filter-section {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 16px;
      border: 2px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: capitalize;
    }

    .filter-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 500px;
      overflow-y: auto;
      padding-right: 8px;
    }

    .todo-list::-webkit-scrollbar {
      width: 6px;
    }

    .todo-list::-webkit-scrollbar-track {
      background: var(--bg);
      border-radius: 10px;
    }

    .todo-list::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 10px;
    }

    .todo-list::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: var(--bg);
      border-radius: 10px;
      border-left: 4px solid var(--primary);
      transition: all 0.2s;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .todo-item:hover {
      box-shadow: var(--shadow-md);
      transform: translateX(4px);
    }

    .todo-item.completed {
      opacity: 0.6;
      border-left-color: var(--success);
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .checkbox {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      min-width: 20px;
      border: 2px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--surface);
    }

    .checkbox:hover {
      border-color: var(--primary);
    }

    .todo-item.completed .checkbox {
      background: var(--success);
      border-color: var(--success);
    }

    .checkbox svg {
      width: 14px;
      height: 14px;
      color: white;
      stroke-width: 3;
    }

    .todo-content {
      flex: 1;
      min-width: 0;
    }

    .todo-text {
      font-size: 14px;
      color: var(--text-primary);
      word-wrap: break-word;
      font-weight: 500;
    }

    .todo-time {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .todo-category {
      display: inline-block;
      font-size: 10px;
      padding: 3px 8px;
      background: var(--primary-light);
      color: var(--primary-dark);
      border-radius: 4px;
      font-weight: 600;
      text-transform: capitalize;
      margin-top: 4px;
    }

    .todo-priority {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 4px;
    }

    .priority-high {
      color: var(--danger);
    }

    .priority-medium {
      color: var(--warning);
    }

    .priority-low {
      color: var(--success);
    }

    .todo-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-muted);
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      opacity: 0.5;
    }

    .empty-state p {
      font-size: 16px;
      font-weight: 500;
    }

    .footer {
      background: var(--bg);
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    .footer-actions {
      display: flex;
      gap: 8px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--surface);
      border-radius: 16px;
      padding: 32px;
      max-width: 500px;
      width: 90%;
      animation: modalSlideIn 0.3s ease;
    }

    @keyframes modalSlideIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .modal-header {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text-primary);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
      text-transform: capitalize;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .modal-actions button {
      flex: 1;
    }

    .tooltip {
      position: relative;
    }

    .tooltip:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text-primary);
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      white-space: nowrap;
      margin-bottom: 8px;
      z-index: 1000;
    }

    @media (max-width: 600px) {
      .container {
        max-width: 100%;
        border-radius: 0;
      }

      .header {
        padding: 24px 16px;
      }

      .header h1 {
        font-size: 24px;
      }

      .content {
        padding: 16px;
      }

      .input-section {
        flex-direction: column;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .filter-section {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>
        <svg class="icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 11 12 14 22 4"></polyline>
          <path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        My Tasks
      </h1>
      <p>Stay organized and productive</p>
    </div>

    <div class="content">
      <!-- Input Section -->
      <div class="input-section">
        <div class="input-wrapper">
          <input
            type="text"
            id="todoInput"
            placeholder="Add a new task..."
            autocomplete="off"
          />
        </div>
        <button class="btn btn-primary" id="addBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Add
        </button>
      </div>

      <!-- Stats -->
      <div class="stats">
        <div class="stat-card">
          <div class="value" id="totalCount">0</div>
          <div class="label">Total</div>
        </div>
        <div class="stat-card">
          <div class="value" id="activeCount">0</div>
          <div class="label">Active</div>
        </div>
        <div class="stat-card">
          <div class="value" id="completedCount">0</div>
          <div class="label">Done</div>
        </div>
      </div>

      <!-- Filter Section -->
      <div class="filter-section">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>

      <!-- Todo List -->
      <div class="todo-list" id="todoList">
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"></path>
          </svg>
          <p>No tasks yet. Add one to get started!</p>
        </div>
      </div>
    </div>

    <div class="footer">
      <span id="storageInfo">Saved locally</span>
      <div class="footer-actions">
        <button class="btn btn-secondary btn-sm" id="clearCompletedBtn" style="padding: 6px 12px; font-size: 12px;">
          Clear Done
        </button>
        <button class="btn btn-danger btn-sm tooltip" id="clearAllBtn" data-tooltip="Clear all tasks" style="padding: 6px 12px; font-size: 12px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <div class="modal-header">Edit Task</div>
      <div class="form-group">
        <label>Task</label>
        <textarea id="editTaskInput"></textarea>
      </div>
      <div class="form-group">
        <label>Priority</label>
        <select id="editPriority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="editCategory">
          <option value="personal">Personal</option>
          <option value="work">Work</option>
          <option value="shopping">Shopping</option>
          <option value="health">Health</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="saveEditBtn">Save Changes</button>
        <button class="btn btn-secondary" id="closeEditBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // Todo App Class
    class TodoApp {
      constructor() {
        this.todos = [];
        this.filter = 'all';
        this.editingId = null;
        this.init();
      }

      init() {
        this.loadFromStorage();
        this.setupEventListeners();
        this.render();
      }

      setupEventListeners() {
        // Input and Add Button
        document.getElementById('todoInput').addEventListener('keypress', (e) => {
          if (e.key === 'Enter') this.addTodo();
        });
        document.getElementById('addBtn').addEventListener('click', () => this.addTodo());

        // Filter Buttons
        document.querySelectorAll('.filter-btn').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            document.querySelectorAll('.filter-btn').forEach((b) => b.classList.remove('active'));
            e.target.classList.add('active');
            this.filter = e.target.dataset.filter;
            this.render();
          });
        });

        // Clear Buttons
        document.getElementById('clearCompletedBtn').addEventListener('click', () => this.clearCompleted());
        document.getElementById('clearAllBtn').addEventListener('click', () => this.clearAll());

        // Edit Modal
        document.getElementById('closeEditBtn').addEventListener('click', () => this.closeEditModal());
        document.getElementById('saveEditBtn').addEventListener('click', () => this.saveEdit());
      }

      addTodo() {
        const input = document.getElementById('todoInput');
        const text = input.value.trim();

        if (!text) {
          input.focus();
          return;
        }

        const todo = {
          id: Date.now(),
          text,
          completed: false,
          priority: 'medium',
          category: 'personal',
          createdAt: new Date().toLocaleString('en-US', {
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          })
        };

        this.todos.unshift(todo);
        input.value = '';
        input.focus();
        this.saveToStorage();
        this.render();
      }

      toggleTodo(id) {
        const todo = this.todos.find((t) => t.id === id);
        if (todo) {
          todo.completed = !todo.completed;
          this.saveToStorage();
          this.render();
        }
      }

      deleteTodo(id) {
        this.todos = this.todos.filter((t) => t.id !== id);
        this.saveToStorage();
        this.render();
      }

      openEditModal(id) {
        const todo = this.todos.find((t) => t.id === id);
        if (!todo) return;

        this.editingId = id;
        document.getElementById('editTaskInput').value = todo.text;
        document.getElementById('editPriority').value = todo.priority;
        document.getElementById('editCategory').value = todo.category;
        document.getElementById('editModal').classList.add('active');
        document.getElementById('editTaskInput').focus();
      }

      closeEditModal() {
        document.getElementById('editModal').classList.remove('active');
        this.editingId = null;
      }

      saveEdit() {
        if (this.editingId === null) return;

        const todo = this.todos.find((t) => t.id === this.editingId);
        if (!todo) return;

        const newText = document.getElementById('editTaskInput').value.trim();
        if (!newText) return;

        todo.text = newText;
        todo.priority = document.getElementById('editPriority').value;
        todo.category = document.getElementById('editCategory').value;

        this.saveToStorage();
        this.render();
        this.closeEditModal();
      }

      clearCompleted() {
        this.todos = this.todos.filter((t) => !t.completed);
        this.saveToStorage();
        this.render();
      }

      clearAll() {
        if (confirm('Are you sure you want to delete all tasks? This cannot be undone.')) {
          this.todos = [];
          this.saveToStorage();
          this.render();
        }
      }

      getFilteredTodos() {
        switch (this.filter) {
          case 'active':
            return this.todos.filter((t) => !t.completed);
          case 'completed':
            return this.todos.filter((t) => t.completed);
          default:
            return this.todos;
        }
      }

      render() {
        const filtered = this.getFilteredTodos();
        const todoList = document.getElementById('todoList');

        // Update stats
        const active = this.todos.filter((t) => !t.completed).length;
        const completed = this.todos.filter((t) => t.completed).length;

        document.getElementById('totalCount').textContent = this.todos.length;
        document.getElementById('activeCount').textContent = active;
        document.getElementById('completedCount').textContent = completed;

        if (filtered.length === 0) {
          todoList.innerHTML = `
            <div class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              <p>${this.filter === 'all' ? 'No tasks yet. Add one to get started!' : `No ${this.filter} tasks.`}</p>
            </div>
          `;
          return;
        }

        todoList.innerHTML = filtered.map((todo) => {
          const priorityIcon = {
            high: '🔴',
            medium: '🟡',
            low: '🟢'
          }[todo.priority];

          return `
            <div class="todo-item ${todo.completed ? 'completed' : ''}">
              <div class="checkbox" onclick="app.toggleTodo(${todo.id})">
                ${
                  todo.completed
                    ? '<svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>'
                    : ''
                }
              </div>
              <div class="todo-content">
                <div class="todo-text">${this.escapeHtml(todo.text)}</div>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                  <div class="todo-category">${todo.category}</div>
                  <div class="todo-priority ${`priority-${todo.priority}`}">
                    ${priorityIcon} ${todo.priority}
                  </div>
                  <div class="todo-time">${todo.createdAt}</div>
                </div>
              </div>
              <div class="todo-actions">
                <button class="btn btn-success tooltip" onclick="app.openEditModal(${todo.id})" data-tooltip="Edit">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                  </svg>
                </button>
                <button class="btn btn-danger tooltip" onclick="app.deleteTodo(${todo.id})" data-tooltip="Delete">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                  </svg>
                </button>
              </div>
            </div>
          `;
        }).join('');

        lucide.createIcons();
      }

      escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      saveToStorage() {
        localStorage.setItem('todos', JSON.stringify(this.todos));
        document.getElementById('storageInfo').textContent = `Last saved: ${new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}`;
      }

      loadFromStorage() {
        const stored = localStorage.getItem('todos');
        this.todos = stored ? JSON.parse(stored) : [];
      }
    }

    // Initialize the app
    const app = new TodoApp();
  </script>
</body>
</html>
