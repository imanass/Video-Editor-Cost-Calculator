<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Editor Cost Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Video Editor Cost Calculator</h1>
    </header>
    <main>
        <section>
            <h2>Calculate Your Costs</h2>
            <form aria-labelledby="calculator" role="form" id="calculator">
                <label for="duration">Duration (minutes):</label>
                <input type="number" id="duration" name="duration" required aria-required="true">
                <br>
                <label for="quality">Quality:</label>
                <select id="quality" name="quality" aria-required="true">
                    <option value="basic">Basic</option>
                    <option value="standard">Standard</option>
                    <option value="premium">Premium</option>
                </select>
                <br>
                <button type="submit">Calculate</button>
            </form>
        </section>
        <section>
            <h2>Results</h2>
            <div id="results"></div>
        </section>
    </main>
    <footer>
        <p>Copyright © 2026</p>
    </footer>
</body>
</html>
