name: HTML Preview

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: HTML Preview
        uses: pavi2410/html-preview-action@v5
        with:
          html_file: index.html
          site_root: .
          upload: auto
          job_summary: true
          retention_days: 30
